<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Password + Salt Time String Encoder</title>
<style>
body { font-family: system-ui, sans-serif; max-width: 800px; margin: 40px auto; padding:20px; }
label { display:block; margin-top:12px; font-weight:600; }
input[type=text], input[type=password] { width:100%; padding:8px; font-family: monospace; }
button { margin-top:16px; padding:10px 16px; background:#007bff; color:white; border:none; border-radius:6px; cursor:pointer; }
button:hover { background:#0056b3; }
pre { background:#f4f4f4; padding:12px; overflow:auto; white-space:pre-wrap; word-break:break-all; }
.row { display:flex; gap:8px; align-items:center; }
</style>
</head>
<body>
<h1>Password + Salt → Time String Encoder</h1>

<label for="password">Password</label>
<input type="text" id="password" value="coconut30050city" autocomplete="off">

<div class="row">
<label for="salt" style="margin:12px 0 0 0;">Salt (hex)</label>
<button id="genSalt" type="button">Generate Random Salt</button>
</div>
<input type="text" id="salt" placeholder="16 bytes hex, e.g. autogen">

<label>
<input type="checkbox" id="useRandomSalt" checked> Auto-generate random salt if empty
</label>

<button id="encodeBtn">Encode Time String</button>

<h3>Output</h3>
<pre id="output">Press Encode to generate...</pre>

<script>
function hex2buf(hex){ const bytes=new Uint8Array(hex.length/2); for(let i=0;i<bytes.length;i++)bytes[i]=parseInt(hex.substr(i*2,2),16); return bytes; }
function buf2hex(buf){ return Array.from(buf).map(b=>b.toString(16).padStart(2,'0')).join(''); }
function str2buf(str){ return new TextEncoder().encode(str); }
function buf2b64(buf){ const bin=[...new Uint8Array(buf)].map(b=>String.fromCharCode(b)).join(''); return btoa(bin); }

async function deriveKey(password, saltBuf) {
  const baseKey = await crypto.subtle.importKey('raw', str2buf(password), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({name:'PBKDF2', salt:saltBuf, iterations:100000, hash:'SHA-256'}, baseKey, 256);
  return bits;
}

document.getElementById('genSalt').addEventListener('click', ()=>{
  const arr=new Uint8Array(16);
  crypto.getRandomValues(arr);
  document.getElementById('salt').value = buf2hex(arr);
});

document.getElementById('encodeBtn').addEventListener('click', async ()=>{
  const password = document.getElementById('password').value;
  let saltHex = document.getElementById('salt').value.trim();
  const useRandom = document.getElementById('useRandomSalt').checked;

  if(!saltHex || useRandom){
    const arr=new Uint8Array(16);
    crypto.getRandomValues(arr);
    saltHex = buf2hex(arr);
    document.getElementById('salt').value = saltHex;
  }
  if(saltHex.length !== 32){ alert('Salt must be 32 hex chars (16 bytes)'); return; }

  const saltBuf = hex2buf(saltHex);
  const now = new Date();
  const pad=n=>String(n).padStart(2,'0');
  const timeString = `${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}`;

  try{
    const keyBits = await deriveKey(password, saltBuf);
    const derivedHex = buf2hex(keyBits);
    // Simple encoding example: base64 of timeString || ':' || derivedHex
    const payload = `${timeString}:${derivedHex}`;
    const b64 = btoa(payload);

    const out = `Password: ${password}
Salt (hex): ${saltHex}
Time String: ${timeString}
Derived Key (PBKDF2-SHA256 100000, hex, 32 bytes): ${derivedHex}

Encoded payload (base64, timeString:derivedKey):
${b64}

Note: This mirrors the PBKDF2 key derivation from cryptographic.py. For full X25519 + ChaCha20Poly1305 encryption as in the Python script, use the server-side implementation.
`;
    document.getElementById('output').textContent = out;
  }catch(e){
    document.getElementById('output').textContent = 'Error: '+e.message;
  }
});
</script>
</body>
</html>
